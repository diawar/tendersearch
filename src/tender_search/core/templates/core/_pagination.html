{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Страницы результатов">{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}{% if favorite_sort %}&amp;sort={{ favorite_sort }}{% endif %}">← Назад</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}{% if favorite_sort %}&amp;sort={{ favorite_sort }}{% endif %}">Далее →</a>{% endif %}</nav>{% endif %}
