{% load search_tags %}<form class="profile-notifications profile-tracking" method="post" action="{% url 'profile_tracking' profile_id=profile.pk %}" hx-post="{% url 'profile_tracking' profile_id=profile.pk %}" hx-swap="outerHTML" hx-trigger="submit, change">{% csrf_token %}<input type="hidden" name="action" value="interval"><button type="submit" name="action" value="toggle" class="telegram-toggle{% if profile.collection_enabled %} enabled{% endif %}" title="{% if profile.collection_enabled %}Приостановить{% else %}Отслеживать{% endif %} подборку: {{ profile.name }}" aria-label="{% if profile.collection_enabled %}Приостановить{% else %}Отслеживать{% endif %} подборку: {{ profile.name }}" aria-pressed="{{ profile.collection_enabled|yesno:'true,false' }}">{% icon 'save' %}</button><div class="interval-label"><input type="hidden" name="hours" value="{{ profile.collection_hours }}"><span class="interval-value" aria-label="Интервал обновления подборки в часах">{{ profile.collection_hours }}</span><span class="interval-arrows"><button type="button" data-hours-step="1" aria-label="Увеличить интервал">▴</button><button type="button" data-hours-step="-1" aria-label="Уменьшить интервал">▾</button></span><span>ч</span></div>{% if tracking_error %}<span class="profile-error" role="alert">{{ tracking_error }}</span>{% endif %}{% if telegram_missing %}<span class="profile-error">Для уведомлений <a href="{% url 'notification_settings' %}">подключите Telegram</a>.</span>{% endif %}</form>
