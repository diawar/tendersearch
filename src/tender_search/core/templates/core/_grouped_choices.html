<div class="procurement-groups">{% for group in groups %}<details class="procurement-group" data-group-label="{{ group.label }}"><summary><input type="checkbox" data-group-toggle aria-label="Выбрать группу {{ group.label }}"><span>{{ group.label }}</span></summary><div class="procurement-children">{% for option in group.options %}<label><input type="checkbox" name="{{ field_name }}" value="{{ option.value }}" {% if option.selected %}checked{% endif %}><span>{{ option.label }}</span></label>{% endfor %}</div></details>{% endfor %}</div>
