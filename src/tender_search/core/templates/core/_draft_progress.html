{% load search_tags %}{% draft_steps item as steps %}<ol class="draft-step-list" aria-label="Этапы подготовки черновика">{% for step in steps %}<li class="draft-step draft-step--{{ step.status }}"{% if step.current %} aria-current="step"{% endif %}><span class="draft-step-marker" aria-hidden="true">{% if step.status == 'done' %}✓{% elif step.status == 'error' %}!{% else %}{{ step.number }}{% endif %}</span><span>{{ step.label }}</span></li>{% endfor %}</ol>
