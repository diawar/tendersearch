<form id="workflow-{{ item.pk }}" class="collection-stage-form" method="post" action="{% url 'collection_move' item_id=item.pk %}">{% csrf_token %}<input type="hidden" name="return_sort" value="{{ collection_sort }}"><input type="hidden" name="return_scope" value="{{ collection_key }}">{% if aggregate_collection %}<a class="collection-workflow-name" href="?profile={{ item.profile_id }}">{{ item.profile.name }}</a>{% endif %}<input type="hidden" name="return_stage" value="{{ stage }}"><label class="sr-only" for="stage-{{ item.pk }}">Этап работы с лотом {{ lot.number }}</label><select id="stage-{{ item.pk }}" name="stage">{% for value,label in stage_choices %}<option value="{{ value }}" {% if item.stage == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><label class="sr-only" for="outcome-{{ item.pk }}">Решение по лоту {{ lot.number }}</label><select id="outcome-{{ item.pk }}" name="outcome">{% for value,label in outcome_choices %}<option value="{{ value }}" {% if item.outcome == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button class="outline" type="submit">Сохранить</button></form>
