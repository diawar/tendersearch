{% load search_tags %}<form class="profile-notifications" method="post" action="{% url 'profile_notifications' profile_id=profile.pk %}" hx-post="{% url 'profile_notifications' profile_id=profile.pk %}" hx-swap="outerHTML" hx-trigger="submit, change">{% csrf_token %}<input type="hidden" name="action" value="interval"><button type="submit" name="action" value="toggle" class="telegram-toggle{% if profile.enabled %} enabled{% endif %}" title="{% if profile.enabled %}Отключить{% else %}Включить{% endif %} Telegram для {{ profile.name }}" aria-label="{% if profile.enabled %}Отключить{% else %}Включить{% endif %} Telegram: {{ profile.name }}" aria-pressed="{{ profile.enabled|yesno:'true,false' }}">{% icon 'send' %}</button><div class="interval-label"><input type="hidden" name="hours" value="{{ profile.interval_hours }}"><span class="interval-value" aria-label="Интервал в часах для {{ profile.name }}">{{ profile.interval_hours }}</span><span class="interval-arrows"><button type="button" data-hours-step="1" aria-label="Увеличить интервал для {{ profile.name }}">▴</button><button type="button" data-hours-step="-1" aria-label="Уменьшить интервал для {{ profile.name }}">▾</button></span><span>ч</span></div>{% if notification_error %}<span class="profile-error" role="alert">{{ notification_error }} <a href="{% url 'notification_settings' %}">Настройки</a></span>{% endif %}{% if profile.monitor_error %}<span class="monitor-indicator" title="{{ profile.monitor_error }}">!</span>{% endif %}</form>
