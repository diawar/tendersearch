{% load search_tags %}<form method="post" action="{% url 'favorite' lot_id=lot.pk %}" {% if not full_reload %}hx-post="{% url 'favorite' lot_id=lot.pk %}" hx-target="closest .lot-actions" hx-swap="outerHTML"{% endif %}>{% csrf_token %}<input type="hidden" name="next" value="{{ return_to|default:request.get_full_path }}"><input type="hidden" name="action" value="{% if lot.is_favorite %}remove{% else %}add{% endif %}"><button type="submit" {% if lot.favorite_locked %}disabled{% endif %} aria-pressed="{{ lot.is_favorite|yesno:'true,false' }}" class="lot-icon favorite-icon{% if lot.is_favorite %} selected{% endif %}" aria-label="{% if lot.is_favorite %}Убрать из избранного{% else %}В избранное{% endif %}: {{ lot.number }}" title="{% if lot.favorite_locked %}Лот в работе — звезда закреплена за этапом{% elif lot.is_favorite %}Убрать из избранного{% else %}В избранное{% endif %}">{% icon 'star' %}</button></form>
