<div id="telegram-status" {% if telegram_ready and not subscription.enabled %}hx-get="{% url 'notification_settings' %}" hx-trigger="every 5s" hx-swap="outerHTML"{% endif %}>{% if not telegram_ready %}<p class="notice">Подключение бота ещё не настроено администратором.</p>{% elif subscription.enabled and subscription.chat_id %}<p class="connection-ok">● Telegram подключён. Подписка активна.</p><form method="post">{% csrf_token %}<button class="outline" name="action" value="disconnect">Отключить Telegram</button></form>{% else %}<p class="muted">Telegram не подключён.</p><form method="post">{% csrf_token %}<button class="primary" name="action" value="connect">Подписаться на Telegram-уведомления</button></form>{% endif %}</div>
