{% load search_tags %}<span class="profile-name-control{% if workspace %} collection-tab{% if profile.pk == active_collection.pk %} active{% endif %}{% endif %}" data-profile-rename="{{ profile.pk }}">
<button type="button" class="profile-rename-start" data-rename-start aria-label="Переименовать подборку {{ profile.name }}" title="Переименовать подборку"><span class="profile-folder">{% icon 'folder' %}</span><span class="profile-pencil">{% icon 'pencil' %}</span></button>
<a data-profile-label href="{% if workspace %}{% url 'workspace' %}?per_page={{ per_page }}&amp;profile={{ profile.pk }}{% if collection_sort %}&amp;sort={{ collection_sort }}{% endif %}{{ workspace_search_suffix }}{% else %}{% url 'search' %}?profile={{ profile.pk }}{% endif %}"{% if workspace and profile.pk == active_collection.pk %} aria-current="page"{% endif %}>{{ profile.name }}</a>
<form method="post" action="{% url 'profile_rename' profile_id=profile.pk %}" data-rename-form hidden>{% csrf_token %}<input name="name" value="{{ profile.name }}" maxlength="200" required aria-label="Название подборки"><button type="submit" class="link" title="Сохранить название" aria-label="Сохранить название"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button><button type="button" class="link" data-rename-cancel title="Отменить" aria-label="Отменить переименование">{% icon 'x' %}</button></form>
<span class="profile-rename-error" data-rename-error role="alert" hidden></span>
</span>
