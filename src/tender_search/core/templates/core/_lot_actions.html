{% load search_tags %}<div class="lot-actions">{% include 'core/_favorite.html' %}<form method="post" action="{% url 'status_watch' lot_id=lot.pk %}" {% if not full_reload %}hx-post="{% url 'status_watch' lot_id=lot.pk %}" hx-target="closest .lot-actions" hx-swap="outerHTML"{% endif %}>{% csrf_token %}<input type="hidden" name="next" value="{{ return_to|default:request.get_full_path }}"><input type="hidden" name="action" value="{% if lot.is_status_watched %}off{% else %}on{% endif %}"><button type="submit" class="lot-icon status-watch-icon{% if lot.is_status_watched %} selected{% endif %}" aria-label="{% if lot.is_status_watched %}Отключить{% else %}Включить{% endif %} слежение за статусом: {{ lot.number }}" title="{% if lot.is_status_watched %}Отключить{% else %}Включить{% endif %} Telegram-слежение за статусом объявления">{% icon 'send' %}</button></form>{% if watch_error %}<span class="watch-error" role="alert">{{ watch_error }} <a href="{% url 'notification_settings' %}">Настройки</a></span>{% endif %}</div>

{% if update_favorite_count %}<span id="sidebar-favorite-count" hx-swap-oob="true">({{ favorite_count }})</span>{% endif %}
