{% load search_tags %}<div class="lot-actions" data-lot-id="{{ lot.pk }}" data-lot-number="{{ lot.number }}">{% if lot.announcement_portal_url %}<a class="lot-icon lot-source-link" href="{{ lot.announcement_portal_url }}" target="_blank" rel="noopener noreferrer" title="Открыть объявление на {{ lot.portal_label }}" aria-label="Открыть объявление на {{ lot.portal_label }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6m0-6L10 14M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/></svg></a>{% endif %}{% include 'core/_favorite.html' %}<button type="button" disabled aria-pressed="{{ lot.is_status_watched|yesno:'true,false' }}" class="lot-icon status-watch-icon{% if lot.is_status_watched %} selected{% endif %}" aria-label="Уведомления {% if lot.is_status_watched %}включены{% else %}выключены{% endif %}: {{ lot.number }}" title="Уведомления {% if lot.is_status_watched %}включены{% else %}выключены{% endif %} · определяются этапом лота">{% icon 'send' %}</button>{% if watch_error %}<span class="watch-error" role="alert">{{ watch_error }} <a href="{% url 'notification_settings' %}">Настройки</a></span>{% endif %}</div>

{% if update_favorite_count %}<span id="sidebar-favorite-count" hx-swap-oob="true">({{ favorite_count }})</span>{% endif %}
