{% load search_tags %}<div class="lot-actions" data-lot-id="{{ lot.pk }}" data-lot-number="{{ lot.number }}">{% include 'core/_favorite.html' %}<button type="button" disabled aria-pressed="{{ lot.is_status_watched|yesno:'true,false' }}" class="lot-icon status-watch-icon{% if lot.is_status_watched %} selected{% endif %}" aria-label="Уведомления {% if lot.is_status_watched %}включены{% else %}выключены{% endif %}: {{ lot.number }}" title="Уведомления {% if lot.is_status_watched %}включены{% else %}выключены{% endif %} · определяются этапом лота">{% icon 'send' %}</button>{% if watch_error %}<span class="watch-error" role="alert">{{ watch_error }} <a href="{% url 'notification_settings' %}">Настройки</a></span>{% endif %}</div>

{% if update_favorite_count %}<span id="sidebar-favorite-count" hx-swap-oob="true">({{ favorite_count }})</span>{% endif %}
