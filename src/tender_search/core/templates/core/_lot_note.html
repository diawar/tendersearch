<section class="panel"><h2>Личная заметка</h2><form class="lot-note-form" method="post" action="{% url 'lot_note_save' lot_id=lot.pk %}">{% csrf_token %}<input type="hidden" name="next" value="{{ back_url }}"><label for="lot-note" class="sr-only">Заметка</label><textarea id="lot-note" name="note" rows="4" maxlength="10000" placeholder="Контакт, условия, следующий шаг…">{{ lot_note }}</textarea><div class="actions"><button type="submit" class="outline">Сохранить заметку</button></div></form></section>
